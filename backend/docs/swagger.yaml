basePath: /
definitions:
  job.CreateJobRequest:
    properties:
      source_type:
        enum:
        - csv
        - json
        - mixed
        example: csv
        type: string
      source_url:
        example: https://covid.ourworldindata.org/data/owid-covid-data.csv
        type: string
    type: object
  models.Job:
    properties:
      created_at:
        type: string
      error_count:
        type: integer
      finished_at:
        type: string
      id:
        type: string
      processed_records:
        type: integer
      source_type:
        type: string
      status:
        type: string
      total_records:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: High-performance concurrent data ingestion and processing pipeline.
  title: Data Processor Pipeline API
  version: "1.0"
paths:
  /api/v1/pipelines:
    post:
      consumes:
      - application/json
      parameters:
      - description: Pipeline Configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/job.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Job'
      summary: Start a new pipeline job
      tags:
      - Pipelines
  /api/v1/pipelines/{id}:
    get:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Job'
      summary: Get pipeline job details
      tags:
      - Pipelines
swagger: "2.0"
